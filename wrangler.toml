name = "rss-worker"
main = "src/worker.js"
compatibility_date = "2026-05-23"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1.0
persist = true
